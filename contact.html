<!doctype html>
<html lang="en-AU">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <meta name="description"
        content="Contact Sovereignty Logistics in Canberra, Australia on +61 402 094 510 or operations@sovereigntylogistics.com to request a confidential service assessment.">
    <link rel="canonical" href="https://www.sovereigntylogistics.com/contact.html">
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="icon" href="assets/icons/favicon.ico">
    <meta name="theme-color" content="#001a36">
    <meta property="og:title" content="Contact / Service Assessment | Sovereignty Logistics">
    <meta property="og:description"
        content="Contact Sovereignty Logistics in Canberra, Australia on +61 402 094 510 or operations@sovereigntylogistics.com to request a confidential service assessment.">
    <meta property="og:type" content="website">
</head>

<body><a class="skip" href="#main">Skip to content</a>
    <main class="approved-page" id="main">
        <div class="artboard"><img class="page-art" src="assets/pages/sovereignty_logistics_contact_assessment_page.png"
                alt="" width="1024" loading="eager">
            <a class="hotspot nav-home" href="index.html" aria-label="Home"></a>
            <a class="hotspot nav-about" href="about.html" aria-label="Who We Are"></a>
            <a class="hotspot nav-services" href="services.html" aria-label="Services"></a>
            <a class="hotspot nav-process" href="process.html" aria-label="Our Process"></a>
            <a class="hotspot nav-standards" href="standards.html" aria-label="Standards and Assurance"></a>
            <a class="hotspot nav-serve" href="who-we-serve.html" aria-label="Who We Serve"></a>
            <a class="hotspot nav-contact" href="contact.html" aria-label="Contact"></a>
            <a class="hotspot nav-lock" href="authorised-access.html" aria-label="Authorised access"></a>
            <form class="form-layer" netlify name="service-assessment" method="POST" data-netlify="true"
                netlify-honeypot="bot-field" action="thank-you.html">
                <input type="hidden" name="form-name" value="service-assessment">
                <p class="honeypot"><label>Do not fill this out: <input name="bot-field"></label></p>
                <label class="sr-only" for="full-name">Full name</label><input class="form-fullname" id="full-name"
                    name="full_name" placeholder="Enter your full name" autocomplete="name" required>
                <label class="sr-only" for="organisation">Organisation</label><input class="form-org" id="organisation"
                    name="organisation" placeholder="Enter your organisation" autocomplete="organization" required>
                <label class="sr-only" for="email">Email</label><input class="form-email" id="email" name="email"
                    type="email" placeholder="Enter your email" autocomplete="email" required>
                <label class="sr-only" for="requirement">Service requirement</label><textarea class="form-service"
                    id="requirement" name="service_requirement" placeholder="Please describe your service requirement"
                    required></textarea>
                <input type="hidden" name="privacy_acknowledgement"
                    value="Submitted through public service assessment form">
                <button class="form-submit" type="submit">SUBMIT REQUEST</button>
            </form>
            <section class="sr-only" aria-label="Page content">
                <h1>Contact / Service Assessment</h1>
                <p>Contact Sovereignty Logistics in Canberra, Australia on +61 402 094 510 or
                    operations@sovereigntylogistics.com to request a confidential service assessment.</p>
            </section>
        </div>
    </main>
</body>

</html>
